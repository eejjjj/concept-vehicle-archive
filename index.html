<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Concept Vehicle Archive</title>
  <link rel="icon" href="assets/favicon_reverse.svg" type="image/svg+xml">
  <script src="js/base.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var n = document.createElement('div');
        n.id = 'file-protocol-warning';
        n.textContent = '请用本地服务器预览（不能直接双击 HTML）。终端运行: bash preview.sh';
        document.body.prepend(n);
      });
    }
  </script>
</head>
<body class="is-intro">

  <section class="entrance" id="entrance" aria-label="Archive entrance">
    <canvas class="intro-canvas" id="intro-canvas" aria-hidden="true"></canvas>
    <p class="entrance__touch-hint" aria-hidden="true">SWIPE TO EXPLORE · BLOW TO TRY · TAP TO ENTER</p>
  </section>

  <div class="transition" id="transition"></div>

  <header class="site-header" id="site-header">
    <a href="./" class="site-logo" aria-label="Back to entrance">
      <img class="site-logo__img" src="assets/x-logo.svg" alt="" width="398" height="198">
    </a>
    <a href="./" class="site-intro-label" id="site-intro-label">Concept Vehicle Archive</a>
  </header>

  <footer class="site-footer">
    Copyright © 2026 Segway-Ninebot. All rights reserved.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/motion.js?v=2"></script>
  <script type="module" src="js/intro-three-front.js?v=32"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
